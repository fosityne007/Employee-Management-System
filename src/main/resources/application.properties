# ===============================
# 🔹 APPLICATION INFO
# ===============================
spring.application.name=employee-service
server.port=8081

# ===============================
# 🔹 PRIMARY DATABASE (PostgreSQL)
# ===============================
# To use PostgreSQL, make sure it's running locally and the database exists
# You can create it with: CREATE DATABASE employee_db;

spring.datasource.url=jdbc:postgresql://localhost:5432/employee_management
spring.datasource.username=postgres
spring.datasource.password=F@metuel
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# 🔹 FALLBACK DATABASE (H2 in-memory)
# ===============================
# If PostgreSQL fails, uncomment the lines below to use H2 for testing
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# ===============================
# 🔹 JPA / HIBERNATE SETTINGS
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# 🔹 FLYWAY (Database Migration)
# ===============================
# Flyway automatically runs SQL migration scripts on startup (if present)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# 🔹 LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.company=DEBUG
